DEFAULT doublecolor
PROMPT 0
TIMEOUT 80
UI vesamenu.c32

MENU TITLE DoubleColor OS

MENU RESOLUTION 1024 768
MENU BACKGROUND splash.png

MENU MARGIN 8
MENU ROWS 6
MENU TABMSGROW 18
MENU CMDLINEROW 19
MENU HELPMSGROW 20
MENU HELPMSGENDROW 28

MENU COLOR border       30;44   #40000000 #00000000 none
MENU COLOR title        1;37;44 #ffe8f0fc #00000000 none
MENU COLOR sel          7;37;40 #ffffffff #cc2f8fd8 all
MENU COLOR unsel        37;40   #ffc9d8ee #00000000 none
MENU COLOR hotkey       1;37;44 #ffe8a33d #00000000 none
MENU COLOR help         37;40   #ff8fb0d8 #00000000 none
MENU COLOR timeout_msg  37;40   #ff8fb0d8 #00000000 none
MENU COLOR timeout      1;37;40 #ffe8a33d #00000000 none
MENU COLOR msg07        37;40   #ffc9d8ee #00000000 none

MENU WIDTH 72

# The BIOS menu uses the syslinux text renderer, which has no Cyrillic glyphs,
# so the entries are in English. The UEFI menu (GRUB) is in Russian.
# Plymouth is disabled on the live medium on purpose: without an initramfs hook
# a failed splash leaves a black screen.

LABEL doublecolor
    MENU LABEL ^1. Start DoubleColor OS (Live)
    MENU DEFAULT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1 nvidia_drm.fbdev=1 zswap.enabled=0 nowatchdog loglevel=4

LABEL nomodeset
    MENU LABEL ^2. Safe graphics (use if the screen stays black)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset zswap.enabled=0 nowatchdog loglevel=4

LABEL verbose
    MENU LABEL ^3. Diagnostics (verbose boot log)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% plymouth.enable=0 zswap.enabled=0 nowatchdog loglevel=7

LABEL reboot
    MENU LABEL ^R. Restart computer
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^P. Power off computer
    COM32 poweroff.c32
