DEFAULT safe
PROMPT 0
TIMEOUT 120
UI vesamenu.c32

MENU TITLE DoubleColor OS

MENU RESOLUTION 1024 768
MENU BACKGROUND splash.png

MENU MARGIN 8
MENU VSHIFT 150
MENU ROWS 7
MENU TABMSGROW 19
MENU CMDLINEROW 20
MENU HELPMSGROW 21
MENU HELPMSGENDROW 28

MENU COLOR border       30;44   #40000000 #00000000 none
MENU COLOR title        1;37;44 #ffe8f0fc #00000000 none
MENU COLOR sel          7;37;40 #ffffffff #cc2f8fd8 all
MENU COLOR unsel        37;40   #ffc9d8ee #00000000 none
MENU COLOR hotkey       1;37;44 #ffe8a33d #00000000 none
MENU COLOR help         37;40   #ff8fb0d8 #00000000 none
MENU COLOR timeout_msg  37;40   #ff8fb0d8 #00000000 none
MENU COLOR timeout      1;37;40 #ffe8a33d #00000000 none
MENU COLOR msg07        37;40   #ffc9d8ee #00000000 none

MENU WIDTH 78

# The BIOS menu uses the syslinux text renderer, which has no Cyrillic glyphs,
# so the entries are in English. The UEFI menu (GRUB) is in Russian.
# Default entry is the guaranteed one: nomodeset, no KMS, screen always works.
# Plymouth is disabled on the live medium: without an initramfs hook a failed
# splash leaves a black screen. systemd.firstboot=0 removes the setup wizard.

LABEL safe
    MENU LABEL ^1. Boot DoubleColor OS (guaranteed, no GPU acceleration)
    MENU DEFAULT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4

LABEL dc0
    MENU LABEL ^2. Boot with GPU acceleration (AMD, legacy display path)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% amdgpu.dc=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4

LABEL nopsr
    MENU LABEL ^3. Boot with GPU acceleration (AMD, PSR off)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% amdgpu.dcdebugmask=0x10 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4

LABEL copytoram
    MENU LABEL ^4. Fast boot (rootfs copied to RAM)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset systemd.firstboot=0 zswap.enabled=0 nowatchdog copytoram=y loglevel=4

LABEL verbose
    MENU LABEL ^5. Diagnostics (verbose boot log)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% plymouth.enable=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=7

LABEL reboot
    MENU LABEL ^R. Restart computer
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^P. Power off computer
    COM32 poweroff.c32
