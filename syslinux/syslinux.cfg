DEFAULT doublecolor
PROMPT 0
TIMEOUT 100
UI vesamenu.c32

MENU TITLE DoubleColor OS Live

LABEL doublecolor
    MENU LABEL DoubleColor Live (linux-zen)
    TEXT HELP
    Рабочая ОС на базе Arch Linux. Ядро linux-zen.
    ENDTEXT
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=DOUBLECOLOR nvidia_drm.modeset=1 nvidia_drm.fbdev=1 zswap.enabled=0 nowatchdog loglevel=3 quiet

LABEL nomodeset
    MENU LABEL DoubleColor Live - bez KMS (esli chernyj ekran)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=DOUBLECOLOR nomodeset zswap.enabled=0 nowatchdog
