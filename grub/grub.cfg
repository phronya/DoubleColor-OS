# DoubleColor OS: меню загрузки UEFI (GRUB).
# Значения %ARCHISO_LABEL%, %INSTALL_DIR%, %ARCH% подставляет mkarchiso.
#
# Пункт 1 рассчитан на видеокарту этой машины (AMD Radeon Vega 8, Raven Ridge):
# amdgpu.dc=0 уводит драйвер на классический путь вывода, из-за которого на
# Raven Ridge часто чёрный экран. Если параметра нет в ядре, модуль просто
# не поднимется и останется efifb — экран всё равно будет виден.
# systemd.firstboot=0 убирает мастер «Initial Setup» на живом носителе.
# Plymouth на Live отключён: без хука в initramfs сбой заставки даёт чёрный экран.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod exfat

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod font
insmod search_label
insmod regexp

set gfxmode=auto
set gfxpayload=keep

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxterm_font=unicode
fi

terminal_output gfxterm

set default=0
set timeout=12
set timeout_style=menu

if [ -f /boot/grub/themes/doublecolor/theme.txt ]; then
    set theme=($root)/boot/grub/themes/doublecolor/theme.txt
    export theme
fi

menuentry "1. Обычный запуск DoubleColor OS" --class arch --class gnu-linux --id doublecolor {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% amdgpu.dc=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "2. Безопасный запуск (без KMS, если чёрный экран)" --class arch --class gnu-linux --id nomodeset {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "3. Быстрый запуск: образ копируется в память" --class arch --class gnu-linux --id copytoram {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% amdgpu.dc=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog copytoram=y loglevel=4
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "4. Диагностика: подробный журнал загрузки" --class arch --class gnu-linux --id verbose {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% plymouth.enable=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=7 systemd.log_level=debug
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "Перезагрузить компьютер" --class reboot --id reboot {
    reboot
}

menuentry "Выключить компьютер" --class shutdown --id poweroff {
    halt
}
