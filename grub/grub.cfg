# DoubleColor OS: меню загрузки UEFI (GRUB).
# Значения %ARCHISO_LABEL%, %INSTALL_DIR%, %ARCH% подставляет mkarchiso.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod exfat

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod font
insmod search_label
insmod regexp

set gfxmode=auto
set gfxpayload=keep

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxterm_font=unicode
fi

terminal_output gfxterm

set default=0
set timeout=10
set timeout_style=menu

if [ -f /boot/grub/themes/doublecolor/theme.txt ]; then
    insmod gfxmenu
    set theme=($root)/boot/grub/themes/doublecolor/theme.txt
    export theme
fi

menuentry "Запустить DoubleColor OS (живая система)" --class arch --class gnu-linux --id doublecolor {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1 nvidia_drm.fbdev=1 zswap.enabled=0 nowatchdog loglevel=3 quiet splash vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "Безопасная графика (если чёрный экран)" --class arch --class gnu-linux --id nomodeset {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset zswap.enabled=0 nowatchdog loglevel=3 splash vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "Перезагрузить компьютер" --class reboot --id reboot {
    reboot
}

menuentry "Выключить компьютер" --class shutdown --id poweroff {
    halt
}
