# DoubleColor OS: меню загрузки UEFI (GRUB).
# Значения %ARCHISO_LABEL%, %INSTALL_DIR%, %ARCH% подставляет mkarchiso.
#
# Пункт по умолчанию — гарантированный: nomodeset отключает KMS, ядро не
# трогает видеокарту, картинку выводит efifb. Этот режим уже проверен на этой
# машине (AMD Radeon Vega 8, Raven Ridge) и доходит до рабочего стола.
# Пункты 2 и 3 включают ускорение: у Raven Ridge чёрный экран обычно лечится
# либо классическим выводом (amdgpu.dc=0), либо отключением PSR
# (amdgpu.dcdebugmask=0x10). Если один из них работает — его и стоит закрепить
# в /etc/default/grub после установки.
#
# systemd.firstboot=0 убирает мастер «Initial Setup» на живом носителе.
# Plymouth на Live отключён: без хука в initramfs сбой заставки даёт чёрный экран.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod exfat

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod font
insmod search_label
insmod regexp

set gfxmode=auto
set gfxpayload=keep

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxterm_font=unicode
fi

terminal_output gfxterm

set default=0
set timeout=10
set timeout_style=menu

if [ -f /boot/grub/themes/doublecolor/theme.txt ]; then
    set theme=($root)/boot/grub/themes/doublecolor/theme.txt
    export theme
fi

menuentry "1. Запуск DoubleColor OS (гарантированный, без ускорения)" --class arch --class gnu-linux --id safe {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "2. Запуск с ускорением графики (AMD, классический вывод)" --class arch --class gnu-linux --id dc0 {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% amdgpu.dc=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "3. Запуск с ускорением (AMD, без PSR)" --class arch --class gnu-linux --id nopsr {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% amdgpu.dcdebugmask=0x10 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "4. Быстрый запуск: образ копируется в память" --class arch --class gnu-linux --id copytoram {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset systemd.firstboot=0 zswap.enabled=0 nowatchdog copytoram=y loglevel=4
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "5. Диагностика: подробный журнал загрузки" --class arch --class gnu-linux --id verbose {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% plymouth.enable=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=7 systemd.log_level=debug
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

menuentry "Перезагрузить компьютер" --class reboot --id reboot {
    reboot
}

menuentry "Выключить компьютер" --class shutdown --id poweroff {
    halt
}
