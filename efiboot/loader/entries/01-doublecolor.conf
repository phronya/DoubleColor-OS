title    DoubleColor OS — живая система (x86_64, UEFI, linux-zen)
linux    /arch/boot/x86_64/vmlinuz-linux-zen
initrd   /arch/boot/x86_64/initramfs-linux-zen.img
options  archisobasedir=arch archisolabel=DOUBLECOLOR nvidia_drm.modeset=1 nvidia_drm.fbdev=1 zswap.enabled=0 nowatchdog loglevel=3 quiet splash vt.global_cursor_default=0
