title    DoubleColor OS — живая система (x86_64, UEFI, linux-zen), гарантированный запуск
linux    /arch/boot/x86_64/vmlinuz-linux-zen
initrd   /arch/boot/x86_64/initramfs-linux-zen.img
options  archisobasedir=arch archisolabel=DOUBLECOLOR nomodeset systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4
