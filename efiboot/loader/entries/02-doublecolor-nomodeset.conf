# Имя файла историческое: сначала здесь был пункт с nomodeset.
# Сейчас это запуск с ускорением графики и классическим выводом AMD.
title    DoubleColor OS — запуск с ускорением графики (AMD, amdgpu.dc=0)
linux    /arch/boot/x86_64/vmlinuz-linux-zen
initrd   /arch/boot/x86_64/initramfs-linux-zen.img
options  archisobasedir=arch archisolabel=DOUBLECOLOR amdgpu.dc=0 systemd.firstboot=0 zswap.enabled=0 nowatchdog loglevel=4
