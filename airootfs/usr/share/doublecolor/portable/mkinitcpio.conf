# mkinitcpio.conf для портативной системы DoubleColor OS.
#
# Отличие от дефолтного конфига Arch: autodetect стоит ПОСЛЕ block и keyboard,
# а kms — до autodetect. Благодаря этому initramfs содержит драйверы хранения,
# ввода и видеовыхода для любого железа, а не только для машины сборки.
# Это и позволяет загружаться с одного USB на разных компьютерах.

MODULES=()
BINARIES=()
FILES=()

HOOKS=(base udev modconf kms keyboard keymap consolefont block autodetect filesystems fsck)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-9 -T0)
