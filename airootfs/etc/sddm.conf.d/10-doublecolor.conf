# SDDM: экран входа в стиле Windows 10.
# Автологин нужен только на Live-образе; в установленную систему этот файл
# не переносится — там обычный вход по паролю.
#
# Plasma 6.8 больше не поставляет X11-сессию (файла plasmax11.desktop нет),
# поэтому используется штатная Wayland-сессия plasma. Если указать несуществующую
# сессию, SDDM молча падает обратно в экран входа и автологин не срабатывает.

[Autologin]
User=root
Session=plasma
Relogin=false

[General]
Numlock=on
DisplayServer=wayland
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=breeze

[Users]
MaximumUid=60000
MinimumUid=1000
