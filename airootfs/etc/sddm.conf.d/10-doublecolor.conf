# SDDM: экран входа в стиле Windows 10.
# Автологин нужен только на Live-образе; в установленную систему этот файл
# не переносится — там обычный вход по паролю.
#
# DisplayServer=x11 и сессия plasmax11 выбраны намеренно: на AMD Vega 8
# графический стек Wayland менее предсказуем, а X11 на 4 ГБ ещё и легче.

[Autologin]
User=root
Session=plasmax11
Relogin=false

[General]
Numlock=on
DisplayServer=x11
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=breeze

[Users]
MaximumUid=60000
MinimumUid=1000
